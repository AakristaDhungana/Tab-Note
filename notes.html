<!Doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tab Note</title>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="notes.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="masthead">
        <div>
          <div class="eyebrow">Tab Note</div>
          <h1>Everything you wrote down</h1>
        </div>
        <div class="counts mono" id="counts"></div>
      </header>

      <div class="controls">s
        <input
          id="search"
          type="search"
          placeholder="Search notes, titles or sites…"
          autocomplete="off"
        />
        <div class="filters" id="filters">
          <button class="quiet f on" data-p="all">All</button>
          <button class="quiet f" data-p="high">High</button>
          <button class="quiet f" data-p="normal">Normal</button>
          <button class="quiet f" data-p="low">Low</button>
          <button class="quiet f" data-p="due">Reminders</button>
        </div>
        <select id="sort" class="sort">
          <option value="updated">Recently edited</option>
          <option value="created">Oldest first</option>
          <option value="priority">Priority</option>
          <option value="site">Site A–Z</option>
        </select>
      </div>

      <ul class="list" id="list"></ul>

      <div class="empty" id="empty" hidden>
        <p class="big" id="emptyTitle">No notes yet.</p>
        <p id="emptyBody">
          Open any page and then click the Tab Note icon in your toolbar, and write a line about
          why it mattersand it will show up here.
        </p>
      </div>

      <footer class="footnote mono">
        Notes will live only in this browser profile (chrome.storage.local). Nothing will be 
        uploaded anywhere.
      </footer>
    </div>
    <script src="storage.js"></script>
    <script src="notes.js"></script>
  </body>
</html>
